# zizmor config — free GitHub Actions scanner (Bugbot replacement).
# Ref-pin (vN tags) is enough for this repo; hash-pin is a later sweep.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  # Dependabot auto-approve must use pull_request_target so GITHUB_TOKEN
  # secrets work. The workflow never checkouts untrusted HEAD.
  dangerous-triggers:
    ignore:
      - dmarc-auto-approve.yml
