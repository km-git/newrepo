[project]
name = "cost"
version = "0.1.0"
requires-python = ">=3.11"
description = "Cloud Cost & Configuration Review — read-only cost + configuration reports"
dependencies = [
  "duckdb>=1.1.0",
  "pyarrow>=17.0.0",
  "boto3>=1.35.0",
  "azure-mgmt-resource>=23.0.0",
  "azure-mgmt-costmanagement>=4.0.0",
  "google-cloud-resource-manager>=1.14.0",
  "google-cloud-billing>=1.13.0",
  "c7n==0.9.45",
  "c7n-org==0.9.45",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "typer>=0.16.0",
  "pyyaml>=6.0.2",
  "feedparser>=6.0.11",
  "rich>=13.0.0",
  "jinja2>=3.1.5",
  "psycopg[binary]>=3.2.0",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
]

# Honest gaps vs the original prompt pin list:
# - steampipe is a CLI binary (AGPL-3.0). Do not pip-install or `import steampipe`.
# - trivy is a CLI binary. Pin the GitHub Action + binary to v0.71.2+; never v0.69.4.
# - trufflehog is a Go CLI, not a pip package of that version.
# - PyPI name for Cloud Custodian is `c7n`, not `cloud-custodian`.
# - Presidio source repo is data-privacy-stack/presidio (PyPI names unchanged).

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.4",
  "mypy>=1.14.0",
  "pip-audit>=2.7.0",
  "detect-secrets>=1.5.0",
]

[project.scripts]
cost = "cost.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cost"]
