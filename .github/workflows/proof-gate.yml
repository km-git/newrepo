name: Proof gate

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/paper_*.py"
      - "engine/continuous_proof.py"
      - "engine/execution_gates.py"
      - "scripts/run_continuous_proof_loop.sh"
      - "scripts/run_paper_proof_daily.sh"
      - "scripts/hooks/**"
      - ".kiro/hooks/**"
      - ".specify/extensions.yml"
  workflow_dispatch:

jobs:
  fast-proof-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: bash scripts/setup_environment.sh --skip-auth

      - name: Fast proof gate (pytest subset)
        run: bash scripts/hooks/run_proof_gate.sh fast

  full-proof-loop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: bash scripts/setup_environment.sh --skip-auth

      - name: Full continuous proof (LLM-free)
        run: bash scripts/hooks/run_proof_gate.sh full
        env:
          EW_OKF_BRAIN_DIR: /tmp/ew-okf-proof-gate
          EW_PAPER_LEDGER: /tmp/ew-paper-proof-gate.json

      - name: Upload proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-reports
          path: |
            reports/CONTINUOUS_PROOF.md
            reports/PAPER_FORWARD.md
          if-no-files-found: ignore
