name: cost-monthly

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pydantic pyyaml

      - name: First-Monday monthly rollup
        run: |
          day=$(TZ=Australia/Sydney date +%d)
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$day" -gt 7 ]]; then
            echo "not the first Monday of the month; skip compound slot"
            exit 0
          fi
          python -m cost scan-all --sandbox
          python -m cost monthly

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "monthly: cost trend rollup"
          title: Monthly cost trend rollup
          body: >
            First Monday 09:00 AEST compound slot. Review spend trend,
            open rightsizing observations, and untagged-resource count.
            [auto-approved]
          branch: monthly/cost-trend
          delete-branch: true
          add-paths: |
            monthly/*.md
            output/cost/report.md
