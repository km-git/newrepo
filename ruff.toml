# Bugbot replacement (local, no LLM): Ruff + Bandit-equivalent S.
# Select matches .pre-commit-config.yaml. Legacy engine/ is not fully linted yet.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"licensespend/**/tests/**" = ["S101", "S603"]
"licensespend/**/cli.py" = ["B008"]
"licensespend/cli.py" = ["B008"]
"licensespend/cli_util.py" = ["B008"]
"licensespend/usage/service.py" = ["S608"]
