# AI PR narrative (Bugbot replacement). Apache-2.0 PR-Agent, BYOK.
# SHA-pinned — never @main. Skips cleanly when OPENAI_KEY is unset so CI stays green.
# Without a key: comment @CodiumAI-Agent /review on public PRs, or install CodeRabbit
# from the GitHub Marketplace (~4 PRs/hr on the free tier, no workflow file).
# Pin: https://github.com/The-PR-Agent/pr-agent/releases/tag/v0.45.0
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent:
    name: pr-agent (AI review)
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - name: Skip when OPENAI_KEY is unset
        id: key
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -n "${OPENAI_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_KEY is not set; skipping PR-Agent."
            echo "Public repos: comment @CodiumAI-Agent /review (no setup)."
            echo "Zero-key alternative: CodeRabbit GitHub Marketplace app."
          fi

      - name: PR Agent
        if: steps.key.outputs.present == 'true'
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          config.model: "gpt-4o-mini"
