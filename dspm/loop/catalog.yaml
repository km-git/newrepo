  - id: tool_renovate
    name: Renovate
    category: other_tool
    module: dspm/loop
    license: AGPL-3.0
    url: https://github.com/renovatebot/renovate
    integrated_in: null
    impact: medium
    challenge: "Dependabot only. Renovate groups SHA-pins for Actions — self-host if Mend-hosted concurrency hits the free cap."
  - id: tool_zizmor
    name: zizmor
    category: other_tool
    module: dspm/loop
    license: Apache-2.0
    url: https://github.com/zizmorcore/zizmor
    integrated_in: null
    impact: high
    challenge: "dspm-auto-approve uses pull_request_target. zizmor would fail the workflow until persist-credentials is locked down."
  - id: tool_actionlint
    name: actionlint
    category: other_tool
    module: dspm/loop
    license: MIT
    url: https://github.com/rhysd/actionlint
    integrated_in: .github/workflows/lint-security.yml
    impact: medium
    challenge: "Existing lint-security job covers workflows; confirm new dspm-*.yml stay actionlint-clean."

