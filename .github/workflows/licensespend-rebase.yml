name: licensespend-rebase

# Read-only notice for Dependabot. Do not check out PR HEAD with a write
# token (CodeQL: uncontrolled checkout of untrusted code).
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Ask Dependabot to rebase onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body "@dependabot rebase"
