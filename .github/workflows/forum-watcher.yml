name: forum-watcher

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      mode:
        description: "Source group"
        required: true
        type: choice
        default: all
        options: [community, vendor, all]

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum-watcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser httpx pyyaml

      - name: Fetch, dedupe, classify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WATCH_MODE: ${{ github.event.inputs.mode || 'all' }}
        run: python scripts/watch.py --mode "${WATCH_MODE}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "discoveries: weekly forum scan"
          title: Discoveries weekly forum scan
          body: >
            Auto-generated by forum-watcher. Review items, check the boxes
            for the ones worth promoting to Evaluate, and merge.
          branch: discoveries/weekly
          delete-branch: true
          add-paths: |
            forum-watcher/discoveries/*.md
            forum-watcher/state/seen.json

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 45
