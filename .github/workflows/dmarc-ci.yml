name: dmarc-ci

on:
  push:
    paths:
      - "dmarc/**"
      - "tests/dmarc/**"
      - "scripts/serve_dmarc.py"
      - ".github/workflows/dmarc-*.yml"
      - "docker-compose.yml"
      - "Makefile"
  pull_request:
    paths:
      - "dmarc/**"
      - "tests/dmarc/**"
      - "scripts/serve_dmarc.py"
      - ".github/workflows/dmarc-*.yml"
      - "docker-compose.yml"
      - "Makefile"
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install toolkit deps
        run: |
          python -m pip install -U pip
          pip install pydantic pyyaml httpx pytest ruff cryptography
          pip install -r dmarc/requirements.txt

      - name: Ruff
        run: ruff check --config ruff.toml --output-format=github dmarc tests/dmarc scripts/serve_dmarc.py

      - name: Pytest dmarc
        run: python -m pytest tests/dmarc dmarc -q --tb=short

      - name: End-to-end fixtures
        run: |
          python -m dmarc audit inventory --output-dir /tmp/dmarc-ci
          python -m dmarc ingest pull --fixtures --output-dir /tmp/dmarc-ci
          python -m dmarc report generate --domain example.com.au --offline --output-dir /tmp/dmarc-ci --output /tmp/dmarc-ci/report.md
          python -m dmarc ui --static --output-dir /tmp/dmarc-ci
