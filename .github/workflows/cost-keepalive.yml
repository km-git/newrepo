name: cost-keepalive

on:
  schedule:
    - cron: "0 3 * * 0"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
