name: dmarc-auto-approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'merge_group' || (
        contains(fromJSON('["dependabot[bot]","github-actions[bot]"]'), github.actor) &&
        contains(github.event.pull_request.body, '[auto-approved]')
      )
    steps:
      - name: Skip template-sensitive paths
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const blocked = files.some(f =>
              f.filename.startsWith('dmarc/templates/') || f.filename === 'dmarc/parsedmarc.ini'
            );
            if (blocked) {
              core.setOutput('skip', 'true');
              core.info('Manual review required for templates/parsedmarc.ini');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Approve bot PR
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'merge_group'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
