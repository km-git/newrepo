# Narrow default for new tape-to-cloud modules; legacy engine/ is not fully linted yet.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"dspm/**/tests/**" = ["S101", "S603"]
"dspm/tools.py" = ["S603"]
"dspm/loop/conflict_resolve.py" = ["S603", "S607"]
"dspm/loop/watch.py" = ["S310"]
"dspm/db/store.py" = ["S608"]
