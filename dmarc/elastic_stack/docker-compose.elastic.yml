# Optional Kibana stack (patschi/parsedmarc-dockerized). Default path is DuckDB+Plotly.
#   docker compose --profile elastic -f dmarc/elastic_stack/docker-compose.elastic.yml up
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  parsedmarc:
    image: patschi/parsedmarc:latest
    volumes:
      - ../parsedmarc.ini:/etc/parsedmarc/config.ini:ro
    depends_on:
      - elasticsearch

volumes:
  es-data:
