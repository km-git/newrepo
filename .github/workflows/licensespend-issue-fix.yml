name: licensespend-issue-fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'good first issue'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      - name: Evaluate issue
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          uv run python - <<'PY'
          import json, os
          from licensespend.loop.service import is_mechanical_issue
          result = is_mechanical_issue(os.environ["TITLE"], os.environ.get("BODY") or "", ["good first issue"])
          print(json.dumps(result))
          if not result.get("eligible"):
              raise SystemExit(0)
          PY

      - name: Comment willing-to-take
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "willing-to-take: evaluating a mechanical auto-fix draft. Graph permissions and pricebook AUD are never auto-fixed."
          gh issue edit "$ISSUE_NUMBER" --add-label "auto-fix-attempted" || true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: placeholder auto-fix for issue ${{ github.event.issue.number }}"
          title: "fix: auto-attempt for issue ${{ github.event.issue.number }}"
          body: |
            Draft placeholder for a mechanical `good first issue`. Not auto-merged.
            Closes #${{ github.event.issue.number }}
          branch: auto-fix/${{ github.event.issue.number }}
          delete-branch: true
          draft: true
