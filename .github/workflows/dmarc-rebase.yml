name: dmarc-rebase

on:
  pull_request:
    types: [synchronize, opened]
  merge_group:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'merge_group' ||
      contains(fromJSON('["dependabot[bot]","github-actions[bot]"]'), github.actor)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase bot PR onto default branch
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.base_ref }}"
          git checkout "${{ github.head_ref }}"
          if git rebase "origin/${{ github.base_ref }}"; then
            git push --force-with-lease origin "${{ github.head_ref }}"
          else
            echo "rebase conflict — leaving for operator"
            git rebase --abort || true
          fi
