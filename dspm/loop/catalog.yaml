# Curated DSPM improvement catalog.
# Categories: forum | github_tool | other_tool | python_lib
# status is resolved at runtime; `integrated_in` is a repo path or null.
# cost must stay $0 — commercial DSPM/DLP/CSPM entries are anti-patterns (skip).

items:
  # --- Forums (Discover sources) ---
  - id: forum_reddit_cybersecurity
    name: r/cybersecurity
    category: forum
    module: dspm/classification
    license: public
    url: https://www.reddit.com/r/cybersecurity/.rss
    integrated_in: dspm/loop/sources.yaml
    impact: high
    challenge: "Are DSPM vendor threads converted into module-fit Discover items or only counted?"
  - id: forum_reddit_netsec
    name: r/netsec
    category: forum
    module: dspm/exposure
    license: public
    url: https://www.reddit.com/r/netsec/.rss
    integrated_in: dspm/loop/sources.yaml
    impact: high
    challenge: "Do CVE threads for Trivy/Prowler bump pins the same week?"
  - id: forum_lobsters_security
    name: Lobsters tag security
    category: forum
    module: dspm/risk
    license: public
    url: https://lobste.rs/t/security.rss
    integrated_in: dspm/loop/sources.yaml
    impact: medium
    challenge: "Is Lobsters in the watcher, or Reddit-only?"
  - id: forum_hn_dspm
    name: Hacker News dspm/pii
    category: forum
    module: dspm/risk
    license: public
    url: https://hn.algolia.com/api/v1/search_by_date?query=dspm%20OR%20presidio%20OR%20%22data%20classification%22&tags=story
    integrated_in: dspm/loop/sources.yaml
    impact: high
    challenge: "Are Show HN DSPM tools evaluated against the catalog before skip?"
  - id: forum_trackawesomelist
    name: Track Awesome List
    category: forum
    module: dspm/audit
    license: public
    url: https://www.trackawesomelist.com/rss.xml
    integrated_in: dspm/loop/sources.yaml
    impact: high
    challenge: "Are awesome-security / awesome-privacy diffs queued as GitHub-tool candidates?"

  # --- GitHub tools ---
  - id: gh_presidio
    name: data-privacy-stack/presidio
    category: github_tool
    module: dspm/classification
    license: MIT
    url: https://github.com/data-privacy-stack/presidio
    integrated_in: dspm/classification/recognizers.py
    impact: critical
    challenge: "Is Presidio installed in CI, or only the stdlib PatternRecognizer fallback?"
  - id: gh_piicatcher
    name: tokern/piicatcher
    category: github_tool
    module: dspm/classification
    license: Apache-2.0
    url: https://github.com/tokern/piicatcher
    integrated_in: dspm/classification/column_heuristics.py
    impact: high
    challenge: "Column-name heuristics ported — should we add table-level DB crawling next?"
  - id: gh_dataprofiler
    name: capitalone/DataProfiler
    category: github_tool
    module: dspm/classification
    license: Apache-2.0
    url: https://github.com/capitalone/DataProfiler
    integrated_in: null
    impact: high
    challenge: "DataProfiler stats + PII labels would lift long-tail columns — candidate for Stage 2.5?"
  - id: gh_cartography
    name: lyft/cartography
    category: github_tool
    module: dspm/access
    license: Apache-2.0
    url: https://github.com/lyft/cartography
    integrated_in: null
    impact: high
    challenge: "No asset/identity graph — Steampipe edges are flat. Cartography Neo4j would close the Cyera identity-gap."
  - id: gh_scoutsuite
    name: nccgroup/ScoutSuite
    category: github_tool
    module: dspm/exposure
    license: GPL-2.0
    url: https://github.com/nccgroup/ScoutSuite
    integrated_in: null
