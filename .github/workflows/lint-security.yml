name: Lint & Security

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  ruff-tape-to-cloud:
    name: ruff (tape-to-cloud + monetization)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9.0"

      - name: Ruff check (new modules)
        run: |
          RUFF_PATHS="tape_to_cloud/ dspm/ engine/monetization_strategy.py engine/tape_to_cloud_hub.py engine/tape_to_cloud_report_html.py engine/tape_to_cloud_reports.py tests/test_monetization_strategy.py tests/test_tape_to_cloud_monetize.py tests/test_tape_to_cloud_hub.py tests/test_tape_to_cloud_layers.py tests/test_tape_to_cloud_reports.py tests/test_tape_to_cloud_pipeline.py tests/test_bugbot_replacement.py tests/test_dspm_architecture.py tests/test_dspm_core.py tests/test_dspm_loop.py tests/test_dspm_improve.py"
          ruff check --output-format=github --config ruff.toml $RUFF_PATHS
          ruff format --check $RUFF_PATHS

  dependency-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          # PYSEC-2026-2447: diskcache pickle RCE if an attacker can write the cache dir.
          # No published fix as of 2026-09-07. EW cache is local (EW_CACHE_DIR), not a
          # shared untrusted store. Ignore so the GitHub check stays green; new CVEs still fail.
          pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2026-2447

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck= -color

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    name: osv-scanner (requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            -L
            ./requirements.txt
            --allow-no-lockfiles

  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install "zizmor>=1.30.0"

      - name: Audit GitHub Actions workflows
        run: zizmor --config zizmor.yml --persona=regular --min-severity high .github/workflows

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # SHA-pinned TruffleHog. Do not add uses: reviewdog/action-setup (CVE-2025-30154).
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified --results=verified

  ruff-sarif:
    name: ruff SARIF (GitHub code scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9.0"

      - name: Ruff SARIF
        run: |
          ruff check --config ruff.toml --output-format sarif \
            tape_to_cloud/ dspm/ engine/monetization_strategy.py engine/tape_to_cloud_hub.py \
            engine/tape_to_cloud_report_html.py engine/tape_to_cloud_reports.py \
            > ruff.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ruff.sarif
          category: ruff
