[project]
name = "dspm"
version = "0.1.0"
description = "Cyera-like Data Security Posture Management built from OSS components"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.1.3",
  "pyarrow==18.1.0",
  "presidio-analyzer==2.2.360",
  "presidio-anonymizer==2.2.360",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "typer==0.16.0",
  "pyyaml==6.0.2",
  "feedparser==6.0.11",
  "rich==14.0.0",
  "psycopg[binary]==3.2.5",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
  "mypy==1.14.0",
  "pip-audit==2.9.0",
]
ai = [
  "transformers==4.46.3",
]
heavy = [
  "spacy==3.8.3",
]

[project.scripts]
dspm = "dspm.cli:app"
dspm-web = "dspm.web.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dspm"]

[tool.hatch.build.targets.wheel.force-include]
"dspm/web/static" = "dspm/web/static"
"dspm/web/templates" = "dspm/web/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
