name: Lint & Security

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  ruff-tape-to-cloud:
    name: ruff (tape-to-cloud + monetization)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9.0"

      - name: Ruff check (new modules)
        run: |
          ruff check --output-format=github --config ruff.toml tape_to_cloud/ engine/monetization_strategy.py engine/tape_to_cloud_hub.py engine/tape_to_cloud_reports.py tests/test_monetization_strategy.py tests/test_tape_to_cloud_monetize.py tests/test_tape_to_cloud_hub.py tests/test_tape_to_cloud_reports.py tests/test_tape_to_cloud_pipeline.py tests/test_bugbot_replacement.py dmarc tests/dmarc scripts/serve_dmarc.py
          ruff format --check tape_to_cloud/ engine/monetization_strategy.py engine/tape_to_cloud_hub.py engine/tape_to_cloud_reports.py tests/test_monetization_strategy.py tests/test_tape_to_cloud_monetize.py tests/test_tape_to_cloud_hub.py tests/test_tape_to_cloud_reports.py tests/test_tape_to_cloud_pipeline.py tests/test_bugbot_replacement.py dmarc tests/dmarc scripts/serve_dmarc.py

  dependency-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          # PYSEC-2026-2447: diskcache pickle RCE if an attacker can write the cache dir.
          # No published fix as of 2026-09-07. EW cache is local (EW_CACHE_DIR), not a
          # shared untrusted store. Ignore so the GitHub check stays green; new CVEs still fail.
          pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2026-2447
          pip-audit -r dmarc/requirements.txt --desc on

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck= -color

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    name: osv-scanner (requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            -L
            ./requirements.txt
            --allow-no-lockfiles

  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install "zizmor>=1.30.0"

      - name: Audit GitHub Actions workflows
        run: zizmor --config zizmor.yml --persona=regular --min-severity high .github/workflows

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan dmarc for secrets
        run: |
          pip install "detect-secrets==1.5.0"
          detect-secrets scan dmarc tests/dmarc scripts/serve_dmarc.py \
            --exclude-files '\.pytest_cache' \
            --exclude-files 'parsedmarc\.ini' \
            > /tmp/detect-secrets.json
          python - <<'PY'
          import json, sys
          data = json.loads(open("/tmp/detect-secrets.json", encoding="utf-8").read())
          results = data.get("results") or {}
          blockers = []
          allow_types = {"Hex High Entropy String", "Base64 High Entropy String"}
          for path, findings in results.items():
              if ".pytest_cache" in path or path.endswith("README.md"):
                  continue
              for item in findings:
                  kind = item.get("type") or ""
                  if kind in allow_types:
                      continue
                  blockers.append(f"{path}: {kind}")
          if blockers:
              print("detect-secrets blockers:")
              print("\n".join(blockers))
              sys.exit(1)
          print("detect-secrets: no blocking findings")
          PY
