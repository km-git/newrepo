name: dspm-monthly

# First Monday 09:00 AEST ≈ first Sunday 23:00 UTC in days 1-7.
on:
  schedule:
    - cron: "0 23 1-7 * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install DSPM
        run: pip install -e .

      - name: Generate the monthly rollup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m dspm loop monthly

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "monthly: rollup"
          title: Monthly DSPM rollup
          body: Auto-generated monthly rollup plus security-posture.md. Review and merge.
          branch: monthly/rollup
          delete-branch: true
          add-paths: |
            monthly/*.md
            state/seen.json
