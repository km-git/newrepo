name: dspm-issue-fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'good first issue'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install DSPM
        run: pip install -e .

      - name: Evaluate issue
        id: eval
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from dspm.loop.issue_fix import is_mechanical_issue
          result = is_mechanical_issue(os.environ["TITLE"], os.environ.get("BODY") or "", ["good first issue"])
          print(json.dumps(result))
          Path = __import__("pathlib").Path
          Path("/tmp/issue-fix.json").write_text(json.dumps(result))
          if not result.get("eligible"):
              raise SystemExit(0)
          PY

      - name: Comment willing-to-take
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "willing-to-take: evaluating a mechanical auto-fix draft."
          gh issue edit "${{ github.event.issue.number }}" --add-label "auto-fix-attempted" || true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "fix: placeholder auto-fix for issue ${{ github.event.issue.number }}"
          title: "fix: auto-attempt for issue ${{ github.event.issue.number }}"
          body: |
            Draft placeholder for a mechanical `good first issue`. Not auto-merged.
            Closes #${{ github.event.issue.number }}
          branch: auto-fix/${{ github.event.issue.number }}
          delete-branch: true
          draft: true
