[project]
name = "cost"
version = "0.1.0"
description = "Cloud Cost & Configuration Review — 10 modules, $0/month"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5",
  "pyarrow==21.0.0",
  "boto3>=1.38.25",
  "azure-mgmt-resource==24.0.0",
  "azure-mgmt-costmanagement==4.0.1",
  "google-cloud-resource-manager==1.14.0",
  "google-cloud-billing==1.15.0",
  "c7n==0.9.45",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "typer==0.16.0",
  "pyyaml==6.0.2",
  "feedparser==6.0.11",
  "rich==14.0.0",
  "jinja2==3.1.5",
  "psycopg[binary]==3.2.5",
]

[project.optional-dependencies]
pii = ["presidio-analyzer==2.2.360", "presidio-anonymizer==2.2.360"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pip-audit>=2.7.0",
]

[project.scripts]
cost = "cost.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
files = ["cost"]
exclude = ["(^|/)tests(/|$)"]
