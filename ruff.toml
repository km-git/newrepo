# Bugbot replacement (local, no LLM): Ruff + Bandit-equivalent S.
# Select matches .pre-commit-config.yaml. Legacy engine/ is not fully linted yet.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S310"]
"dmarc/**/tests/**" = ["S101", "S603"]
"dmarc/webui.py" = ["E501"]
"dmarc/loop/watch.py" = ["E501"]
"dmarc/report_writer/service.py" = ["E501"]
"sspm/**/tests/**" = ["S101", "S603"]
"dspm/**/tests/**" = ["S101", "S603"]
"dspm/tools.py" = ["S603"]
"dspm/loop/conflict_resolve.py" = ["S603", "S607"]
"dspm/loop/watch.py" = ["S310"]
"dspm/db/store.py" = ["S608"]
"tape_to_cloud/sample_reports.py" = ["E501"]
"engine/tape_to_cloud_hub.py" = ["E501"]
"engine/tape_to_cloud_reports.py" = ["E501"]
"engine/monetize_ui.py" = ["S104"]
"sspm/**" = ["E501", "S104", "S105", "S106", "S107", "S603", "S607", "S608"]
"scripts/serve_sspm.py" = ["E402"]
"scripts/serve_monitor.py" = ["E402", "E501"]
"cost/**/tests/**" = ["S101", "S603"]
"cost/adapters.py" = ["E501", "S112"]
"cost/db/store.py" = ["S608"]
"cost/loop/service.py" = ["E501"]
"cost/loop/watch.py" = ["S310"]
"cost/loop/conflict_resolve.py" = ["S607"]
"cost/cli.py" = ["B008", "S104"]
"cost/tools.py" = ["S603", "S607"]
"cost/webui/server.py" = ["S104"]
"cost/report_writer/service.py" = ["W291", "E501"]
"cost/**" = ["E501", "RUF001", "W291", "S104", "S112"]
