[project]
name = "dspm"
version = "0.1.0"
description = "OSS Data Security Posture Management (Cyera-like) — 12 modules, $0/month"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
analytics = ["duckdb==1.5.5", "pyarrow>=17.0.0"]
pii = ["presidio-analyzer==2.2.360", "presidio-anonymizer==2.2.360", "spacy>=3.8.0"]
cspm = ["prowler==5.41.0"]
remediation = ["c7n==0.9.45"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pip-audit>=2.7.0",
]
# CLI tools are NOT pip packages: cloudquery, trivy>=0.70 (never 0.69.4), steampipe (AGPL CLI only).
# torch/transformers are optional offline NER (DSPM_HF_NER=1) and are not installed by default.

[project.scripts]
dspm = "dspm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dspm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
files = ["dspm"]
exclude = ["(^|/)tests(/|$)"]
