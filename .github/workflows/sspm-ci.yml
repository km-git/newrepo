name: sspm-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r sspm/requirements-ci.txt

      - name: Ruff
        run: ruff check --config ruff.toml sspm tests/test_sspm_architecture.py tests/test_sspm_core.py tests/test_sspm_loop.py tests/test_sspm_web.py tests/test_sspm_report.py tests/test_sspm_cli.py

      - name: Pytest SSPM
        run: pytest tests/test_sspm_architecture.py tests/test_sspm_core.py tests/test_sspm_loop.py tests/test_sspm_web.py tests/test_sspm_report.py tests/test_sspm_cli.py sspm/*/tests -q --tb=short

      - name: pip-audit --strict (published deps only)
        run: pip-audit --strict --desc on -r sspm/requirements-ci.txt

      - name: make sspm-all
        run: make sspm-all PYTHON=python3
