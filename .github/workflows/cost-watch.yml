name: cost-watch

# Monday 09:00 AEST = Sunday 23:00 UTC (AEST UTC+10).
# GitHub schedule timezone keys require actionlint newer than 1.7.7; UTC cron is the portable form.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install COST
        run: pip install -e .

      - name: Run Discover + gap-audit + GitHub/PyPI evaluate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m cost loop improve

      - name: Force-add Discover artifacts
        run: |
          git add -f state/discover_queue.json state/gap_audit.json state/candidates.md state/seen.json || true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "discover: COST forum + GitHub + PyPI improve cycle"
          title: "Discover — COST improve cycle"
          body: |
            Auto-generated Discover queue, gap audit, and next-integration candidates.
            Operator reviews Monday 09:00 AEST. Not auto-merged.
          branch: discover/cost-watch
          delete-branch: true
          add-paths: |
            state/seen.json
            state/accept-reject.jsonl
            state/discover_queue.json
            state/gap_audit.json
            state/candidates.md
