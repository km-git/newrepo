# Sample parsedmarc.ini — password from environment, never committed.
# Run: parsedmarc --config dmarc/parsedmarc.ini
# Provision rua=mailto:dmarc@customer-domain.com.au first.

[general]
save_aggregate = True
save_forensic = True
output = output/dmarc/parsedmarc
offline = True

[imap]
host = imap.example.com.au
port = 993
ssl = True
user = dmarc@example.com.au
password = ${DMARC_IMAP_PASS}

[mailbox]
reports_folder = INBOX
watch = False
