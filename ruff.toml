# Bugbot replacement (local, no LLM): Ruff + Bandit-equivalent S.
# Select matches .pre-commit-config.yaml. Legacy engine/ is not fully linted yet.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"dmarc/**/tests/**" = ["S101", "S603"]
"dmarc/webui.py" = ["E501"]
"dmarc/loop/watch.py" = ["E501"]
"dmarc/report_writer/service.py" = ["E501"]
"engine/tape_to_cloud_hub.py" = ["E501"]
"engine/tape_to_cloud_reports.py" = ["E501"]
