name: licensespend-rebase

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == github.event.pull_request.head.repo.full_name
    steps:
      # Default pull_request checkout (merge commit). Do not set ref to
      # pull_request.head.* — CodeQL flags that as untrusted-checkout.
      # persist-credentials: false so GITHUB_TOKEN is not written into the tree.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase Dependabot branch onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "licensespend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          if ! git rebase origin/main; then
            git rebase --abort || true
            gh pr comment "$PR" --body "@operator merge conflict on this PR — please resolve manually"
            exit 1
          fi
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"
