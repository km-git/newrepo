name: licensespend-watch

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install watcher deps
        run: pip install feedparser httpx pyyaml

      - name: Fetch, dedupe, classify (reuses forum-watcher)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: forum-watcher
        run: python scripts/watch.py

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "discoveries: licensespend forum scan"
          title: Discoveries — licensespend weekly forum scan
          body: >
            Auto-generated by licensespend-watch via forum-watcher.
            Review items. Not auto-merged. Skip Zylo/Productiv/Torii.
          branch: discoveries/licensespend-weekly
          delete-branch: true
          add-paths: |
            forum-watcher/discoveries/*.md
            forum-watcher/state/seen.json
