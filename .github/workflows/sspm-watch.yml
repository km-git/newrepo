name: sspm-watch

# Monday 09:00 AEST. timezone key per 2026-03-19 GitHub Actions changelog.
on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install pydantic PyYAML feedparser httpx

      - name: Run Discover (SSPM context)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m sspm loop watch --fetch

      - name: Force-add Discover artifacts
        run: |
          git add -f state/discover_queue.json state/seen.json || true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "discover: SSPM forum + cnspec improve cycle"
          title: "Discover — SSPM improve cycle"
          body: |
            Auto-generated Discover queue. Operator reviews Monday 09:00 AEST. Not auto-merged.
          branch: discover/sspm-watch
          delete-branch: true
          add-paths: |
            state/seen.json
            state/discover_queue.json
            monthly/*.md
