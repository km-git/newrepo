# zizmor config — free GitHub Actions scanner (Bugbot replacement).
# Ref-pin (vN tags) is enough for this repo; hash-pin is a later sweep.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  # Dependabot approval needs pull_request_target so GITHUB_TOKEN can approve
  # the PR. The job never checks out PR HEAD (prompt hard rule: bot-only).
  dangerous-triggers:
    ignore:
      - sspm-auto-approve.yml
