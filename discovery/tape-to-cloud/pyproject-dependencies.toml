# Tape-to-cloud dependency matrix (reference — not wired into ew_tool yet).
# Full catalog: discovery/tape-to-cloud/free-tool-inventory.md §7
# Install with uv: copy blocks into pyproject.toml, then `uv lock && uv sync`

[project]
requires-python = ">=3.12"
dependencies = [
    # HTTP / schema
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # LLM
    "litellm>=1.50",
    "instructor>=1.3",
    "pydantic-evals>=0.1",
    # AWS / S3 (SeaweedFS, RustFS, Garage backends)
    "boto3>=1.35",
    "aioboto3>=13.0",
    "obstore>=0.5",
    # Analytics
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=17.0",
    # Tape / VTL parsers
    "libratom>=0.7",
    "extract-msg>=0.48",
    "cvpysdk>=11.0",
    # Email migration
    "msgraph-sdk>=1.0",
    "azure-identity>=1.16",
    "imapclient>=3.0",
    # OCR
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "paddleocr>=2.7",
    # Transcription
    "faster-whisper>=1.0",
    "yt-dlp>=2024.5",
    # Hashing
    "blake3>=1.0",
    "cryptography>=43.0",
    # Orchestration
    "temporalio>=1.9",
    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "pyright>=1.1",
    "interrogate>=1.7",
    "pip-audit>=2.7",
    "prek>=0.5",
]
