name: dmarc-monthly

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    # Compound slot: first Monday of the month only.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pydantic pyyaml httpx && pip install -r dmarc/requirements.txt || true

      - name: Skip unless first Monday (schedule)
        id: gate
        run: |
          day=$(date +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$day" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write monthly artifacts
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m dmarc ingest pull --fixtures --output-dir output/dmarc
          python -m dmarc monthly --output-dir output/dmarc --monthly-dir monthly

      - name: Create Pull Request
        if: steps.gate.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "monthly: deliverability trend rollup"
          title: Monthly deliverability trend rollup
          body: |
            First-Monday 09:00 AEST compound slot.
            Artifacts: monthly/YYYY-MM.md and monthly/deliverability-trend.md
            [auto-approved]
          branch: monthly/dmarc-rollup
          delete-branch: true
          add-paths: |
            monthly/*.md
