# Kit copy of .github/workflows/monthly-rollup.yml
name: monthly-rollup

on:
  schedule:
    - cron: "0 9 1-7 * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (default: current UTC month)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum-watcher
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Build monthly rollup
        run: |
          MONTH="${{ github.event.inputs.month }}"
          if [ -z "$MONTH" ]; then
            python scripts/monthly.py
          else
            python scripts/monthly.py --month "$MONTH"
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "monthly: source-quality rollup"
          title: Monthly forum-watcher rollup
          body: >
            Auto-generated first-Monday rollup. Top sources, accept/reject
            ratios, community-shift flips, vendor major versions, new tools.
          branch: monthly/rollup
          delete-branch: true
          add-paths: |
            forum-watcher/monthly/*.md

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 45
