name: sspm-monthly

# First Monday 09:00 AEST = first Sunday 23:00 UTC in days 1-7.
on:
  schedule:
    - cron: "0 23 1-7 * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install pydantic PyYAML

      - name: Generate the monthly rollup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m sspm loop monthly

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "monthly: SSPM rollup"
          title: Monthly SSPM rollup
          body: Auto-generated monthly rollup. Review and merge. Not auto-merged.
          branch: monthly/sspm-rollup
          delete-branch: true
          add-paths: |
            monthly/*.md
            state/seen.json
