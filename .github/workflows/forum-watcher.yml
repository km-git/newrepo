name: forum-watcher

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum-watcher
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser httpx pyyaml

      - name: Fetch, dedupe, classify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/watch.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "discoveries: weekly forum scan"
          title: Discoveries weekly forum scan
          body: >
            Auto-generated by forum-watcher. Review items, check the boxes
            for the ones worth promoting to Evaluate, and merge.
          branch: discoveries/weekly
          delete-branch: true
          add-paths: |
            forum-watcher/discoveries/*.md
            forum-watcher/state/seen.json
