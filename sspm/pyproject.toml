[project]
name = "sspm"
version = "0.1.0"
description = "SSPM-as-report: read-only SaaS configuration posture (M365, GWS, GitHub, Slack, Okta)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
analytics = ["duckdb==1.5.5", "pyarrow>=17.0.0"]
pii = ["presidio-analyzer==2.2.360", "presidio-anonymizer==2.2.360"]
saas = [
  "msgraph-sdk==1.5.0",
  "google-api-python-client==2.165.0",
  "PyGithub==2.6.1",
  "slack-sdk==3.36.0",
  "httpx==0.28.1",
]
report = ["jinja2==3.1.5", "croniter==6.0.0", "rich==14.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pip-audit>=2.7.0",
]
# cnspec is a CLI subprocess, not a pip library.
# Presidio installs from data-privacy-stack/presidio (not microsoft/presidio).
# No Trivy and no Steampipe in this build.

[project.scripts]
sspm = "sspm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sspm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
files = ["sspm"]
