name: sspm-auto-approve

# Dependabot PRs are same-repo, so pull_request is enough (zizmor dangerous-triggers).
# Check the PR author, not github.actor (zizmor bot-conditions).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repo only. Bots, or operator opt-in via [auto-approved] in the body.
    if: >
      github.repository == github.event.pull_request.head.repo.full_name &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        contains(github.event.pull_request.body, '[auto-approved]')
      )
    steps:
      - name: Flag disclaimer and loop paths (never auto-merge)
        id: protected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')
          if echo "$files" | grep -E 'sspm/disclaimers/|sspm/loop/'; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
            echo "Disclaimer/loop paths present — approve allowed, auto-merge blocked"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve the PR
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: >
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.protected.outputs.protected != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # As of 2026-03-25 GitHub returns HTTP 422 unless required checks exist.
          # sspm-ci.yml reports on pull_request + merge_group for that requirement.
          gh pr merge --auto --squash "$PR_URL" || echo "auto-merge not enabled (HTTP 422 if required checks missing)"
