name: dspm-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install DSPM (stdlib extras only)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --config ruff.toml dspm tests/test_dspm_architecture.py tests/test_dspm_core.py tests/test_dspm_loop.py

      - name: Mypy
        run: mypy dspm/

      - name: Pytest DSPM
        run: pytest tests/test_dspm_architecture.py tests/test_dspm_core.py tests/test_dspm_loop.py -q --tb=short

      - name: pip-audit
        run: pip-audit --strict || pip-audit -r requirements.txt --desc on

      - name: Setup Trivy (safe post-CVE-2026-33634 pin)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.71.2

      - name: Refuse malicious Trivy window
        run: |
          ver=$(trivy --version)
          echo "$ver"
          python -c "from dspm.tools import assert_trivy_allowed; import subprocess; t=subprocess.check_output(['trivy','--version'], text=True); print(assert_trivy_allowed(t))"

      - name: Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --config trivy.yaml .
