[project]
name = "dmarc"
version = "0.1.0"
description = "Email Deliverability & Brand-Protection Monitor (DMARC/SPF/DKIM)"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5",
  "pyarrow==21.0.0",
  "dnspython==2.7.0",
  "cryptography==44.0.0",
  "parsedmarc==8.6.4",
  "imaplib2==3.6",
  "aiosmtplib==3.0.1",
  "plotly==5.24.0",
  "presidio-analyzer==2.2.360",
  "presidio-anonymizer==2.2.360",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "typer==0.16.0",
  "pyyaml==6.0.2",
  "feedparser==6.0.11",
  "rich==14.0.0",
  "jinja2==3.1.5",
  "psycopg[binary]==3.2.5",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.0",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
  "mypy==1.14.0",
  "pip-audit==2.9.0",
]

[project.scripts]
dmarc = "dmarc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmarc"]

[tool.hatch.build.targets.wheel.force-include]
"dmarc/web/static" = "dmarc/web/static"
"dmarc/web/templates" = "dmarc/web/templates"
"dmarc/db/schema.sql" = "dmarc/db/schema.sql"
"disclaimers" = "disclaimers"
"samples" = "samples"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"dmarc/**/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
