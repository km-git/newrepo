[project]
name = "sspm"
version = "0.1.0"
description = "SSPM-as-report: read-only SaaS configuration posture reports"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5",
  "pyarrow==21.0.0",
  "presidio-analyzer==2.2.360",
  "presidio-anonymizer==2.2.360",
  "msgraph-sdk==1.5.4",
  "google-api-python-client==2.165.0",
  "PyGithub==2.6.1",
  "slack-sdk==3.36.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "typer==0.16.0",
  "pyyaml==6.0.2",
  "feedparser==6.0.11",
  "rich==14.0.0",
  "jinja2==3.1.5",
  "psycopg[binary]==3.2.5",
  "croniter==6.0.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.0",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
  "mypy==1.14.0",
  "pip-audit==2.9.0",
  "detect-secrets==1.5.0",
]

[project.scripts]
sspm = "sspm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sspm"]

[tool.pytest.ini_options]
testpaths = ["tests", "sspm"]
pythonpath = ["."]
