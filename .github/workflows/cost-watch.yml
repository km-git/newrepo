name: cost-watch

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser httpx pyyaml pydantic

      - name: Forum watcher + cost sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python forum-watcher/scripts/watch.py || true
          python -m cost.loop.watch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "discoveries: weekly cost + forum scan"
          title: Discoveries weekly cost forum scan
          body: >
            Auto-generated by cost-watch / forum-watcher. Review items, check
            the boxes for the ones worth promoting to Evaluate, and merge.
            [auto-approved]
          branch: discoveries/cost-weekly
          delete-branch: true
          add-paths: |
            forum-watcher/discoveries/*.md
            forum-watcher/state/seen.json
            cost/loop/discoveries/*.md
            monthly/*.md
