  - id: gh_checkov
    name: bridgecrewio/checkov
    category: github_tool
    module: dspm/encryption_check
    license: Apache-2.0
    url: https://github.com/bridgecrewio/checkov
    integrated_in: null
    impact: high
    challenge: "Trivy covers IaC; Checkov CIS policies overlap — parse Checkov JSON as a second exposure feed?"
  - id: gh_gitleaks
    name: gitleaks/gitleaks
    category: github_tool
    module: dspm/encryption_check
    license: MIT
    url: https://github.com/gitleaks/gitleaks
    integrated_in: null
    impact: high
    challenge: "Secret scanning is Trivy-only. Gitleaks CLI would catch git-history secrets Trivy fs misses."
  - id: gh_cloudsplaining
    name: salesforce/cloudsplaining
    category: github_tool
    module: dspm/access
    license: BSD-3-Clause
    url: https://github.com/salesforce/cloudsplaining
    integrated_in: null
    impact: high
    challenge: "Over-privileged IAM scoring is a stub. Cloudsplaining HTML/JSON is the OSS IAM Privilege Escalation map."
  - id: gh_pmapper
    name: nccgroup/PMapper
    category: github_tool
    module: dspm/access
    license: MIT
    url: https://github.com/nccgroup/PMapper
    integrated_in: null
    impact: medium
    challenge: "Principal graph for AWS IAM — complements Steampipe; still CLI-only."
  - id: gh_osv_scanner
    name: google/osv-scanner
    category: github_tool
    module: dspm/audit
    license: Apache-2.0
    url: https://github.com/google/osv-scanner
    integrated_in: null
    impact: high
    challenge: "pip-audit is in dspm-ci; OSV-Scanner SARIF would cover Go CLIs (Trivy, CloudQuery) pip-audit cannot see."
  - id: gh_syft
    name: anchore/syft
    category: github_tool
    module: dspm/audit
    license: Apache-2.0
    url: https://github.com/anchore/syft
    integrated_in: null
    impact: medium
    challenge: "No SBOM of the DSPM image itself — Syft CycloneDX is free and matches the tape-to-cloud loop."
  - id: gh_postgres_anonymizer
    name: dalibo/postgresql_anonymizer
    category: github_tool
    module: dspm/remediation
    license: PostgreSQL
    url: https://gitlab.com/dalibo/postgresql_anonymizer
    integrated_in: null
    impact: medium
    challenge: "Masking is Presidio-anonymizer stub. postgres_anonymizer is the on-prem dump-masking engine AU SMBs actually run."
  - id: gh_great_expectations
    name: great-expectations/great_expectations
    category: github_tool
    module: dspm/classification
    license: Apache-2.0
    url: https://github.com/great-expectations/great_expectations
    integrated_in: null
    impact: medium
    challenge: "Expect suites on classified columns would catch schema drift that Presidio regex misses."

  # --- Other tools (CLI / platforms, still $0) ---
  - id: tool_osv_dev
