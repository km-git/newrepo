name: dmarc-watch
on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dmarc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run DMARC forum watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from dmarc.loop.watch import run_watch; import json; print(json.dumps(run_watch()))"
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "discover: dmarc weekly forum scan"
          title: "Discover: weekly DMARC forum items"
          body: "[auto-approved] Auto-generated discover PR from dmarc-watcher."
          branch: discover/dmarc-weekly
          delete-branch: true
          add-paths: |
            dmarc/discoveries/*.md
            dmarc/state/seen.json
