[project]
name = "ew-sibling-tools"
version = "0.1.0"
description = "Sibling OSS builds: DSPM (Cyera-like) + Cloud Cost & Configuration Review"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
analytics = ["duckdb==1.5.5", "pyarrow>=17.0.0"]
cloud = [
  "boto3>=1.38.25",
  "azure-mgmt-resource==24.0.0",
  "azure-mgmt-costmanagement==4.0.1",
  "google-cloud-resource-manager==1.14.0",
  "google-cloud-billing==1.15.0",
  "httpx==0.28.1",
  "typer==0.16.0",
  "feedparser==6.0.11",
  "rich==14.0.0",
  "jinja2==3.1.5",
  "psycopg[binary]==3.2.5",
]
pii = ["presidio-analyzer==2.2.360", "presidio-anonymizer==2.2.360", "spacy>=3.8.0"]
cspm = ["prowler==5.41.0"]
remediation = ["c7n==0.9.45"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "types-PyYAML>=6.0.12",
  "pip-audit>=2.7.0",
]
# CLI tools are NOT pip packages: cloudquery, trivy>=0.70 (never 0.69.4), steampipe (AGPL CLI only).
# torch/transformers are optional offline NER (DSPM_HF_NER=1) and are not installed by default.

[project.scripts]
cost = "cost.cli:app"
dspm = "dspm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cost", "dspm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
files = ["cost", "dspm"]
exclude = ["(^|/)tests(/|$)", "(^|/)dspm/dspm/"]
