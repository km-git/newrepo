services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dspm
      POSTGRES_PASSWORD: dspm
      POSTGRES_DB: dspm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dspm/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  datahub:
    image: acryldata/datahub-actions:v1.2.0.1
    command: ["python", "-m", "datahub_actions.entrypoint"]
    depends_on:
      - postgres
    environment:
      DATAHUB_GMS_HOST: http://datahub-gms:8080
    profiles: ["catalog"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dspm
      MINIO_ROOT_PASSWORD: dspm-dspm-dspm
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
