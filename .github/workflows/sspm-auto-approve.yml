name: sspm-auto-approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bot PRs only. Human-authored PRs are never auto-approved.
    # pull_request_target so Dependabot secrets are accessible.
    if: >
      github.repository == github.event.pull_request.head.repo.full_name &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'github-actions[bot]'
      )
    steps:
      - name: Block auto-merge of disclaimer and loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[].filename')
          if echo "$files" | grep -E 'sspm/disclaimers/|sspm/loop/'; then
            echo "Disclaimer wording and forum-watcher logic require manual review"
            exit 1
          fi

      - name: Approve the PR
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # As of 2026-03-25 GitHub returns HTTP 422 unless required checks exist.
          # sspm-ci.yml reports on pull_request + merge_group for that requirement.
          gh pr merge --auto --squash "$PR_URL" || echo "auto-merge not enabled (HTTP 422 if required checks missing)"
