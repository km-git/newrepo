name: licensespend-monthly

on:
  schedule:
    - cron: "0 9 1 * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LICENSESPEND_INCLUDE_EMAIL: "0"
      LICENSESPEND_APPLY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      - name: Generate monthly unused-seat trend
        run: uv run python -m licensespend loop monthly

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "monthly: license-spend rollup"
          title: Monthly license-spend rollup
          body: Auto-generated unused-seat dollar trend. Review and merge.
          branch: monthly/license-spend
          delete-branch: true
          add-paths: |
            monthly/license-spend.md
            licensespend/state/monthly.json
