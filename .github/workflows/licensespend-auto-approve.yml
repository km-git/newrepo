name: licensespend-auto-approve

# Dependabot PRs are same-repo, so pull_request is enough (zizmor dangerous-triggers).
# Check the PR author, not github.actor (zizmor bot-conditions).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Block auto-approve of operator-owned paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')
          if echo "$files" | grep -Eq 'licensespend/usage/pricebook.yaml|licensespend/m365/README.md'; then
            echo "Graph permissions / pricebook AUD require manual review"
            exit 1
          fi

      - name: Approve the PR
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # As of 2026-03-25 GitHub returns HTTP 422 unless required checks exist.
          gh pr merge --auto --squash "$PR_URL" || echo "auto-merge not enabled (HTTP 422 if required checks missing)"
