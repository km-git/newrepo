# On-demand mhvtl validation. NEVER use GitHub-hosted runners for tape tests
# (no /dev/sg). Self-hosted label: mhvtl. Docker Hub adrianj/mhvtl does not
# exist (404 as of 2026-09-07); set repo variable MHVTL_DOCKER_IMAGE only if
# you have a real privileged image AND the host already loaded mhvtl.ko.
name: mhvtl-validate

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules from the promoted Discover"
        required: false
        default: "tape-ops,vtl-cloud,tape-duplicate"
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 9 1 * *"
      timezone: "Australia/Sydney"

permissions:
  contents: read

jobs:
  refuse-hosted-tape:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mhvtl-runner')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Disk-only smoke (tape tests must SKIP on this runner)
        env:
          VALIDATE_MODULES: ${{ github.event.inputs.modules || 'tape-ops,vtl-cloud,tape-duplicate' }}
          GITHUB_ACTIONS: "true"
        working-directory: forum-watcher
        run: |
          python scripts/validate.py --modules "$VALIDATE_MODULES"
          echo "GitHub-hosted path is disk-only. Tape tests skip by hard rule."

  mhvtl:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mhvtl-runner')
    runs-on: [self-hosted, linux, mhvtl]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forum-watcher
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tape + disk smoke on mhvtl runner
        env:
          VALIDATE_MODULES: ${{ github.event.inputs.modules || 'tape-ops,vtl-cloud,tape-duplicate' }}
          MHVTL_FULL: "0"
        run: python scripts/validate.py --modules "$VALIDATE_MODULES"

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Touch keepalive stamp
        run: |
          mkdir -p forum-watcher/state
          date -u +%Y-%m-%dT%H:%M:%SZ > forum-watcher/state/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum-watcher/state/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: mhvtl keepalive"
          git push
