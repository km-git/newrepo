name: dspm-keepalive

# Weekly commit so scheduled workflows are not paused after 60 days of inactivity.
# gautamkrishnar/keepalive-workflow is disabled on GitHub (403); this is the in-repo equivalent.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Touch keepalive timestamp
        run: |
          mkdir -p state
          date -u +%Y-%m-%dT%H:%M:%SZ > state/keepalive.txt
          git config user.name "dspm-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: weekly keepalive to prevent Actions 60-day pause"
          git push
